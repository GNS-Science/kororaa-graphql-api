[coverage:run]
# uncomment the following to omit files during running
#omit =
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    def main

[tox:tox]
isolated_build = true
envlist = py312, format, lint, build

[gh-actions]
python =
    3.12: py312, format, lint, build

[testenv]
allowlist_externals = pytest
dependency_groups = dev
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONWARNINGS = ignore
    TESTING = 1
commands =
    pytest --cov=kororaa_graphql_api --cov-branch --cov-report=xml --cov-report=term-missing tests

[testenv:audit]
allowlist_externals =
    uv
commands =
    uv export --format requirements-txt --no-emit-project -o audit.txt
    uv run pip-audit -r audit.txt --require-hashes
    uv run safety scan

[testenv:format]
allowlist_externals =
    uv
dependency_groups = dev
commands =
    uv run ruff format kororaa_graphql_api tests

[testenv:lint]
allowlist_externals =
    uv
dependency_groups = dev
commands =
    uv run ruff check kororaa_graphql_api tests
    uv run mypy kororaa_graphql_api tests

[testenv:build-linux]
allowlist_externals =
    uv
    mkdocs
dependency_groups = dev,doc
commands =
    uv build
    mkdocs build

[tool:pytest]
testpaths =
    tests
markers =
    slow: slow tests
