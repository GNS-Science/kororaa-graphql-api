[project]
name = "kororaa-graphql-api"
version = "0.10.1"
description = "A Grapql application API for NZHSM Kororaa UI.."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "AGPL-3.0-or-later"
authors = [
    {name = "Chris B Chamberlain", email = "chrisbc@artisan.co.nz"},
    {name = "NSHM Compute Working Group", email = "nshm@gns.cri.nz"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
]
urls = {homepage = "https://github.com/gns-science/kororaa-graphql-api"}
dependencies = [
    "boto3>=1.24.57",
    "flask>=3.0.3",
    "flask-cors>=6.0",
    "graphene>=3.3",
    "graphql-server==3.0.0b7",
    "nzshm-common>=0.6.0",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "bump2version",
    "moto>=5.1",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pytest-cov",
    "pytest",
    "ruff",
    "safety",
    "sgqlc",
    "tox",
    "tox-uv",
    "types-python-dateutil",
    "types-pyyaml",
]

doc = [
    "mkdocs-autorefs",
    "mkdocs-click",
    "mkdocs-include-markdown-plugin",
    "mkdocs-material-extensions",
    "mkdocs-material",
    "mkdocs",
    "mkdocstrings-python",
    "mkdocstrings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kororaa_graphql_api"]

[tool.hatch.build.targets.sdist]
include = ["kororaa_graphql_api", "tests"]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { "nzshm-common" = false }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "G004"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
ignore_missing_imports = true
