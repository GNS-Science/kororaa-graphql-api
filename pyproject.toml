[project]
name = "kororaa-graphql-api"
version = "0.9.3"
homepage = "https://github.com/gns-science/kororaa-graphql-api"
description = "A Grapql application API for NZHSM Kororaa UI.."
authors = [
    {name = "Chris B Chamberlain",email = "chrisbc@artisan.co.nz"},
    {name="NSHM Compute Working Group", email="nshm@gns.cri.nz"}
]
readme = "README.md"
requires-python = "^3.12"
license = "AGPL-3.0-or-later"
classifiers=[
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3.12',    
]
packages = [
    { include = "kororaa_graphql_api" },
    { include = "tests", format = "sdist" },
]

dependencies = [
    "boto3 (>=1.24.57)",
    "flask (>=3.0.3)",
    "flask-cors (>=6.0)",
    "graphene (>=3.3)",
    "graphql-server (==3.0.0b7)",
    "nzshm-common (>=0.6.0)",
    "python-dateutil (>=2.8.2)",
    "pyyaml (>=6.0.1)",
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.doc]
optional = true

[dependency-groups]
dev = [
    "black",
    "bump2version",
    "flake8-docstrings",
    "flake8",
    "isort",
    "moto (>=5.1)",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pytest-cov",
    "pytest",
    "safety",
    "sgqlc",
    "tox",
    "types-python-dateutil",
    "types-pyyaml"
]

doc = [
    "mkdocs-autorefs",
    "mkdocs-click",
    "mkdocs-include-markdown-plugin",
    "mkdocs-material-extensions",
    "mkdocs-material",
    "mkdocs",
    "mkdocstrings-python",
    "mkdocstrings"
]

# [tool.poetry.group.doc.dependencies]
# pymdown-extensions = {version = "^10.0"}

[tool.black]
line-length = 120
skip-string-normalization = true
target-version = ['py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
skip_gitignore = true
# you can skip files as below
#skip_glob = docs/conf.py

[build-system]
requires = ["poetry-core>=1.1.0b3"]
build-backend = "poetry.core.masonry.api"
